version: 2

# Bumps are kept out of the release notes by default: almost all of them are
# test, CI, or build-time-only dependencies a consumer never sees. Drop
# skip-changelog by hand for the exception -- dnlib is packed into the nupkg, so
# users run it and a bump belongs in the notes.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
