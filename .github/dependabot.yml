version: 2

# Bumps stay out of the release notes: every dependency here is test, CI, or
# build-time only, so a version number tells a consumer nothing. dnlib is no
# exception -- it is packed into the package, but runs inside the MSBuild task
# and never reaches the consumer's app. If a bump does change what Publicizer
# does to an assembly, write that up as its own note rather than surfacing the
# bump line.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "semver:patch"
      - "skip-changelog"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
