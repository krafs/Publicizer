name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Job names below are matched by main's required status checks. Renaming a job
# blocks every PR until branch protection is updated to match.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore
      run: dotnet restore src/Publicizer.Tests/Publicizer.Tests.csproj --locked-mode

    - name: Test
      run: dotnet test src/Publicizer.Tests/Publicizer.Tests.csproj -c Release --no-restore --collect "XPlat Code Coverage" --results-directory coverage

    - name: Summarize coverage
      if: ${{ !cancelled() }}
      run: node scripts/coverage-summary.mjs coverage

    - name: Upload coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: coverage/**/coverage.cobertura.xml

  e2e:
    # End-to-end tests build a real consumer and exercise the task under an MSBuild host.
    # dotnet = Core MSBuild; msbuild = desktop MSBuild.exe (.NET Framework), the Visual
    # Studio host. The builder is selected per leg via PUBLICIZER_TEST_BUILDER.
    # The msbuild leg leans on MSBuild.exe's SDK resolver finding the .NET SDK that
    # setup-dotnet puts on PATH — the consumer projects target a version VS doesn't ship.
    # If that pairing drifts, the leg fails with an opaque SDK-resolution error.
    name: E2E (${{ matrix.os }}, ${{ matrix.builder }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder: dotnet
          - os: windows-latest
            builder: msbuild
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLICIZER_TEST_BUILDER: ${{ matrix.builder }}
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Set up MSBuild
      if: matrix.builder == 'msbuild'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Restore
      run: dotnet restore src/Publicizer.E2ETests/Publicizer.E2ETests.csproj --locked-mode

    - name: Test
      run: dotnet test src/Publicizer.E2ETests/Publicizer.E2ETests.csproj -c Release --no-restore
