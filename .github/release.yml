changelog:
  # Whether a PR earns a line is a per-PR call, not one an author can make.
  # Dependabot labels its own PRs skip-changelog, so bumps are hidden unless the
  # label is removed -- see .github/dependabot.yml for the dnlib exception.
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - "semver:major"
    - title: Features
      labels:
        - "semver:minor"
    - title: Fixes & Improvements
      labels:
        - "semver:patch"
