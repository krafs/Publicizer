changelog:
  # skip-changelog is the only exclusion: whether a PR earns a line is a judgment
  # call per PR, not something an author or a path glob can decide. A dependabot
  # bump of a shipped dependency (dnlib) belongs in the notes; a test-only or CI
  # bump does not.
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - "semver:major"
    - title: Features
      labels:
        - "semver:minor"
    - title: Fixes & Improvements
      labels:
        - "semver:patch"
