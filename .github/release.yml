changelog:
  # Whether a PR earns a line is a per-PR call, not one an author or path glob
  # can make: a dependabot bump of dnlib ships to users, a test-only bump doesn't.
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - "semver:major"
    - title: Features
      labels:
        - "semver:minor"
    - title: Fixes & Improvements
      labels:
        - "semver:patch"
