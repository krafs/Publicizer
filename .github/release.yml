changelog:
  # A line is earned by changing something a consumer can observe, which is a
  # per-PR call. Dependabot labels its own PRs skip-changelog, so bumps never
  # land here on their own.
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - "semver:major"
    - title: Features
      labels:
        - "semver:minor"
    - title: Fixes & Improvements
      labels:
        - "semver:patch"
